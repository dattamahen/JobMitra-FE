<div class="meta-row" [class.meta-row--wrap]="wrap()" [style]="hostStyle()">
  @for (item of visibleItems(); track item.text) {
    @if (item.href) {
      <a class="meta-item" [href]="item.href" target="_blank" rel="noopener noreferrer">
        <mat-icon class="meta-item__icon">{{ item.icon }}</mat-icon>
        <span class="meta-item__text">{{ item.text }}</span>
      </a>
    } @else {
      <span class="meta-item">
        <mat-icon class="meta-item__icon">{{ item.icon }}</mat-icon>
        <span class="meta-item__text">{{ item.text }}</span>
      </span>
    }
  }
</div>
