<div class="page-container">
	@if (isLoading()) {
		<app-skeleton-form [showSidebar]="true" [sidebarItems]="7" [rows]="3" [columns]="2"
			[showTitle]="true" [showButton]="true">
		</app-skeleton-form>
	} @else {
		<div class="resume-builder-content">
			@if (builderMode() === 'entry') {
				<div class="builder-entry-screen">
					<h2 class="builder-entry-title">What would you like to do?</h2>
					<div class="builder-entry-tiles">
						<button class="builder-entry-tile" (click)="showJdModal.set(true)" aria-label="CV as per Job Description">
							<mat-icon>auto_awesome</mat-icon>
							<span class="tile-title">CV as per JD</span>
							<span class="tile-desc">Tailor your CV to match a specific job description using AI</span>
						</button>
						<button class="builder-entry-tile" (click)="builderMode.set('form')" aria-label="Manual Changes">
							<mat-icon>edit_note</mat-icon>
							<span class="tile-title">Manual Changes</span>
							<span class="tile-desc">Edit your resume sections manually with full control</span>
						</button>
					</div>
				</div>
			} @else {
				<app-resume-forms
					[user]="user()"
					[personalInfoValues]="personalInfoValues()"
					[summaryValues]="summaryValues()"
					[skillsValues]="skillsValues()"
					[experienceValues]="experienceValues()"
					[educationValues]="educationValues()"
					[projectsValues]="projectsValues()"
					[certificationsValues]="certificationsValues()"
					(back)="builderMode.set('entry')"
					(openJdModal)="showJdModal.set(true)">
				</app-resume-forms>
			}
		</div>

		@if (showJdModal()) {
			<app-resume-jd-modal
				[personalInfoValues]="personalInfoValues()"
				[skillsValues]="skillsValues()"
				[experienceValues]="experienceValues()"
				[educationValues]="educationValues()"
				[projectsValues]="projectsValues()"
				[certificationsValues]="certificationsValues()"
				(closed)="showJdModal.set(false)"
				(tailoredApplied)="onTailoredApplied($event)">
			</app-resume-jd-modal>
		}
	}
</div>
