<div class="profile-forms-wrapper">
	<mat-card class="form-card">
		<mat-card-content>
			<app-dynamic-form #basicForm
				[config]="basicInfoConfig" [initialValues]="basicInfoValues()"
				[readonly]="!isBasicInfoEditing()"
				(formSubmit)="onBasicInfoSubmit($event)"
				(toggleEdit)="isBasicInfoEditing.set(!isBasicInfoEditing())"
				[submitButtonText]="TEXT.formButtons.updateBasicInfo" />
		</mat-card-content>
	</mat-card>

	<mat-card class="form-card">
		<mat-card-content>
			<app-dynamic-form #skillsForm
				[config]="skillsConfig" [initialValues]="skillsValues()"
				[readonly]="!isSkillsEditing()"
				(formSubmit)="onSkillsSubmit($event)"
				(toggleEdit)="isSkillsEditing.set(!isSkillsEditing())"
				[submitButtonText]="TEXT.formButtons.updateSkills" />

			<div class="skill-suggest-row">
				@if (isSuggestingSkills()) {
					<button mat-stroked-button color="accent" disabled>
						<mat-icon class="spin">sync</mat-icon> Suggesting skills…
					</button>
				} @else {
					<button mat-stroked-button color="accent" (click)="fetchSkillSuggestions()" [disabled]="skills().length === 0">
						<mat-icon>auto_awesome</mat-icon> Suggest skills with AI
					</button>
				}
			</div>

			@if (skillSuggestions().length > 0) {
				<div class="skill-suggestions-panel">
					<p class="suggest-label"><mat-icon>lightbulb</mat-icon> Tap to add relevant skills</p>
					<div class="suggest-chips">
						@for (skill of skillSuggestions(); track skill.name) {
							<button class="suggest-chip" (click)="addSuggestedSkill(skill)" [attr.aria-label]="'Add ' + skill.name">
								<mat-icon>add</mat-icon> {{ skill.name }}
								@if (skill.version) { <span class="suggest-chip-version">v{{ skill.version }}</span> }
							</button>
						}
					</div>
				</div>
			}
		</mat-card-content>
	</mat-card>

	<mat-card class="form-card">
		<mat-card-content>
			<div class="ai-generate-row">
				@if (isGeneratingSummary()) {
					<button mat-stroked-button color="primary" disabled>
						<mat-icon class="spin">sync</mat-icon> Generating...
					</button>
				} @else {
					<button mat-stroked-button color="primary" (click)="generateProfessionalSummary()">
						<mat-icon>auto_awesome</mat-icon> Generate Summary with AI
					</button>
				}
			</div>
			<app-dynamic-form #professionalForm
				[config]="professionalConfig" [initialValues]="professionalValues()"
				[readonly]="!isProfessionalEditing()"
				(formSubmit)="onProfessionalSubmit($event)"
				(toggleEdit)="isProfessionalEditing.set(!isProfessionalEditing())"
				[submitButtonText]="TEXT.formButtons.updateProfessionalInfo" />
		</mat-card-content>
	</mat-card>

	<mat-card class="form-card">
		<mat-card-content>
			<app-dynamic-form #experienceForm
				[config]="experienceConfig" [initialValues]="experienceValues()"
				[readonly]="!isExperienceEditing()"
				(formSubmit)="onExperienceSubmit($event)"
				(toggleEdit)="isExperienceEditing.set(!isExperienceEditing())"
				[submitButtonText]="TEXT.formButtons.updateExperience" />
			<div class="ai-generate-row ai-generate-inline">
				@if (isGeneratingJobDesc()) {
					<button mat-stroked-button color="primary" disabled>
						<mat-icon class="spin">sync</mat-icon> Generating...
					</button>
				} @else {
					<button mat-stroked-button color="primary" (click)="generateJobDescriptionForLatest()">
						<mat-icon>auto_awesome</mat-icon> Generate Roles and Responsibilities with AI
					</button>
				}
			</div>
		</mat-card-content>
	</mat-card>

	<mat-card class="form-card">
		<mat-card-content>
			<app-dynamic-form #educationForm
				[config]="educationConfig" [initialValues]="educationValues()"
				[readonly]="!isEducationEditing()"
				(formSubmit)="onEducationSubmit($event)"
				(toggleEdit)="isEducationEditing.set(!isEducationEditing())"
				[submitButtonText]="TEXT.formButtons.updateEducation" />
		</mat-card-content>
	</mat-card>

	<mat-card class="form-card">
		<mat-card-content>
			<app-dynamic-form #projectsForm
				[config]="projectsConfig" [initialValues]="projectsValues()"
				[readonly]="!isProjectsEditing()"
				(formSubmit)="onProjectsSubmit($event)"
				(toggleEdit)="isProjectsEditing.set(!isProjectsEditing())"
				[submitButtonText]="TEXT.formButtons.updateProjects" />
		</mat-card-content>
	</mat-card>

	<mat-card class="form-card">
		<mat-card-content>
			<app-dynamic-form #certificationsForm
				[config]="certificationsConfig" [initialValues]="certificationsValues()"
				[readonly]="!isCertificationsEditing()"
				(formSubmit)="onCertificationsSubmit($event)"
				(toggleEdit)="isCertificationsEditing.set(!isCertificationsEditing())"
				[submitButtonText]="TEXT.formButtons.updateCertifications" />
		</mat-card-content>
	</mat-card>

	<mat-card class="form-card">
		<mat-card-content>
			<app-dynamic-form #jobPreferencesForm
				[config]="jobPreferencesConfig" [initialValues]="jobPreferencesValues()"
				[readonly]="!isJobPreferencesEditing()"
				(formSubmit)="onJobPreferencesSubmit($event)"
				(toggleEdit)="isJobPreferencesEditing.set(!isJobPreferencesEditing())"
				[submitButtonText]="TEXT.formButtons.updateJobPreferences" />
		</mat-card-content>
	</mat-card>
</div>
