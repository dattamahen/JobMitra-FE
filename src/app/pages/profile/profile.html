<div class="page-container">
	@if (profileMode() === 'loading') {
		<app-skeleton-form [repeat]="3" [rows]="3" [columns]="2" [showSidebar]="true" />
	}

	@if (profileMode() === 'entry') {
		<div class="entry-screen">
			<div class="entry-tiles">
				<button class="entry-tile" (click)="selectCvUpload()">
					<mat-icon>upload_file</mat-icon>
					<span class="tile-title">Upload CV</span>
					<span class="tile-desc">Auto-fill your profile from a PDF or DOCX resume</span>
				</button>
				<button class="entry-tile" (click)="selectManualEntry()">
					<mat-icon>edit_note</mat-icon>
					<span class="tile-title">Fill Manually</span>
					<span class="tile-desc">Enter your details step by step in the form</span>
				</button>
			</div>
		</div>
	}

	@if (profileMode() === 'upload') {
		<app-profile-cv-upload
			(saved)="onCvSaved()"
			(cancelled)="onCvCancelled()" />
	}

	@if (profileMode() === 'form') {
		<div class="profile-layout">
			<div class="profile-form-section">
				<app-profile-forms
					[user]="currentUser()"
					(saved)="loadUserProfile()" />
			</div>
			<app-profile-sidebar [user]="currentUser()" />
		</div>

		<button class="cv-fab" (click)="selectCvUpload()" aria-label="Upload CV to update profile">
			<mat-icon>upload_file</mat-icon>
			<span>Upload CV</span>
		</button>
	}
</div>
