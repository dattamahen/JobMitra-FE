<div class="page-container">
	<div class="dashboard-content">
		@if (isLoading()) {
			<app-skeleton-stat-grid
				[count]="4"
				[columns]="{ default: 4, tablet: 2, mobile: 2 }"
				[showTrend]="true"
				[cardHeight]="'120px'">
			</app-skeleton-stat-grid>
			<app-skeleton-list-rows
				[count]="5"
				[showLeadingCircle]="true"
				[showTrailingBadge]="true"
				[showSecondLine]="false"
				[cardTitle]="TEXT.recentActivity">
			</app-skeleton-list-rows>
		} @else if (dashboardData()) {
			@if (statGridConfig(); as sgc) {
				<app-ui-stat-grid [config]="sgc" (statClick)="onStatClick($event)" />
			}

			@if (activityFeedConfig(); as afc) {
				<app-ui-activity-feed [config]="afc" />
			}

			<div class="dashboard-footer">
				<small class="last-updated">
					<mat-icon>schedule</mat-icon>
					{{ TEXT.lastUpdated }} {{ dashboardData()!.lastUpdated | date:'medium' }}
				</small>
			</div>
		}
	</div>
</div>
