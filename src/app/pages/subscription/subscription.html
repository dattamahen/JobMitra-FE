<div class="page-container">
	<div class="section-header">
		<h2>{{TEXT.pageTitle}}</h2>
		<p>{{TEXT.pageSubtitle}}</p>
	</div>

	@if (loading()) {
		<app-skeleton-stat-grid
			[count]="2"
			[columns]="{ default: 2, tablet: 2, mobile: 1 }"
			[showTrend]="false"
			[cardHeight]="'100px'">
		</app-skeleton-stat-grid>
	} @else if (credits()) {
		<app-ui-stat-grid [config]="{
			stats: [
				{ id: 'cv', label: TEXT.labels.cvDownloadsRemaining, value: credits()!.cv_downloads_remaining, icon: 'description', color: 'primary' },
				{ id: 'interview', label: TEXT.labels.mockInterviewsRemaining, value: credits()!.mock_interviews_remaining, icon: 'record_voice_over', color: 'info' }
			],
			columns: { default: 2, tablet: 2, mobile: 1 }
		}" />

		<app-ui-section-card [config]="{ title: TEXT.labels.needMoreCredits, icon: 'shopping_cart' }">
			<div class="buy-section">
				@if (plan()) {
					<p>Get <strong>{{plan()!.cv_downloads}} CV Downloads</strong> + <strong>{{plan()!.mock_interviews}} Mock Interviews</strong> for just <strong>₹{{plan()!.amount}}</strong> (incl. GST)</p>
				}
				<button mat-raised-button color="primary" (click)="openBuyDialog()">
					<mat-icon>shopping_cart</mat-icon>
					{{TEXT.labels.buyCredits}}
				</button>
			</div>
		</app-ui-section-card>


	}
</div>
